<!-- Комплексный маркетинг: варианты 2–5 -->
<style>
/* ---------- 2. Календарь: месяц первого этапа листками, под ним две цены ---------- */
#complex[data-v="2"] .strips { max-width: var(--wrap); margin: 72px auto 0; padding: 0 32px; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 16px; }
#complex[data-v="2"] .strips__line, #complex[data-v="2"] .strip__dot { display: none; }
#complex[data-v="2"] .strip { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 0 24px 26px; clip-path: none; box-shadow: var(--shadow); }
.js #complex[data-v="2"] .strip.reveal, .js #complex[data-v="4"] .strip.reveal { translate: 0 44px; }
.js #complex[data-v="2"] .strip.reveal.is-in, .js #complex[data-v="4"] .strip.reveal.is-in { translate: 0 0; }
#complex[data-v="2"] .strip::before { content: ""; position: absolute; left: 26px; top: -9px; width: 10px; height: 24px; border-radius: 5px; background: var(--coral); box-shadow: 34px 0 0 var(--coral); z-index: 1; }
#complex[data-v="2"] .strip b { align-self: stretch; margin: 0 -24px 6px; padding: 24px 24px 14px; background: var(--navy); color: #fff; }
#complex[data-v="2"] .strip--cream { background: var(--paper); }
#complex[data-v="2"] .strip--cyan { grid-column: span 2; }
#complex[data-v="2"] .strip--coral, #complex[data-v="2"] .strip--navy { grid-column: span 2; }
#complex[data-v="2"] .strip--navy b { background: var(--cyan); color: var(--navy); }
#complex[data-v="2"] .strip__t { font-size: 30px; }
#complex[data-v="2"] .strip p { font-size: 15.5px; }
#complex[data-v="2"] .strip__price { margin-top: auto; padding-top: 10px; font-size: 54px; }
#complex[data-v="2"] .strip__price small { display: inline; margin-left: 6px; }
@media (max-width: 1000px) {
  #complex[data-v="2"] .strips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #complex[data-v="2"] .strip--cyan { order: 1; }
  #complex[data-v="2"] .strip--coral, #complex[data-v="2"] .strip--navy { order: 2; }
}
@media (max-width: 760px) {
  #complex[data-v="2"] .strips { grid-template-columns: 1fr; padding: 0 18px; margin-top: 52px; gap: 26px; }
  #complex[data-v="2"] .strip--cyan, #complex[data-v="2"] .strip--coral, #complex[data-v="2"] .strip--navy { grid-column: auto; order: 0; }
  #complex[data-v="2"] .strip__price { font-size: 44px; }
}

/* ---------- 3. Два этапа: «строим основу» и «развиваем по подписке» рядом ---------- */
#complex[data-v="3"] .strips, #complex[data-v="3"] .parts { display: none; }
.stages { display: grid; grid-template-columns: minmax(0, 1.12fr) auto minmax(0, .88fr); align-items: stretch; gap: 0 22px; margin-top: 64px; }
.stage { position: relative; display: flex; flex-direction: column; padding: 46px 40px 38px; }
.stage--one { background: var(--paper); box-shadow: var(--shadow); rotate: -.5deg; }
.stage--two { color: var(--cream); background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.4px); background-size: 6px 6px; clip-path: polygon(0 1.5%, 100% 0, 99% 100%, 1% 98.5%); }
.stage__tag { font: 600 13px/1.2 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--coral-ink); }
.stage--two .stage__tag { color: var(--cyan); }
.stage h3 { margin-top: 12px; font: 700 clamp(32px, 3.3vw, 46px)/1 var(--cond); text-transform: uppercase; letter-spacing: -.01em; color: var(--navy); }
.stage--two h3 { color: #fff; }
.stage__weeks { flex: 1; list-style: none; margin: 26px 0 0; padding: 0; display: grid; align-content: start; }
.stage__weeks li { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 2px dotted rgba(228,95,69,.6); }
.stage__weeks b { font: 600 15px/1.3 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
.stage__weeks span { font-size: 15.5px; color: var(--muted); }
.stage__price { margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--navy); font: 700 58px/1 var(--cond); letter-spacing: -.02em; color: var(--navy); white-space: nowrap; }
.stage__price small { display: block; margin-top: 10px; font: 400 15px/1.35 var(--sans); letter-spacing: 0; color: var(--muted); white-space: normal; }
.stage--two .stage__price { color: #fff; border-top-color: rgba(8,174,234,.7); }
.stage--two .stage__price small { color: rgba(247,242,233,.8); }
.stage__arrow { align-self: center; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--coral-btn); color: #fff; font: 400 30px/1 var(--sans); padding-bottom: 4px; }
/* кольцо подписки: пять дел месяца по кругу */
.loop { flex: 1; position: relative; width: min(100%, 290px); aspect-ratio: 1; margin: 26px auto 10px; display: grid; place-items: center; }
.loop::before { content: ""; position: absolute; inset: 12%; border: 2.5px dashed var(--cyan); border-radius: 50%; animation: loopSpin 40s linear infinite; }
@keyframes loopSpin { to { rotate: 360deg; } }
.loop b { font: 600 14px/1.25 var(--cond); letter-spacing: .16em; text-transform: uppercase; text-align: center; color: var(--cyan); }
.loop span { position: absolute; left: 50%; top: 50%; translate: -50% -50%; transform: rotate(var(--a)) translateY(-248%) rotate(calc(var(--a) * -1)); background: var(--cream); color: var(--navy); padding: 9px 13px 8px; font: 700 16px/1 var(--cond); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 8px 14px -8px rgba(0,0,0,.6); }
.loop span:nth-of-type(2) { background: var(--cyan); }
.loop span:nth-of-type(5) { background: var(--coral-btn); color: #fff; }
@media (max-width: 1000px) {
  .stages { grid-template-columns: 1fr; gap: 18px; margin-top: 44px; }
  .stage__arrow { justify-self: center; rotate: 90deg; margin: -4px 0; }
}
@media (max-width: 760px) {
  .stage { padding: 38px 22px 30px; }
  .stage--one { rotate: none; }
  .stage__weeks li { grid-template-columns: 1fr; gap: 4px; }
  .stage__price { font-size: 48px; }
  .loop { width: min(100%, 270px); }
  .loop span { font-size: 15px; padding: 8px 11px 7px; }
}

/* ---------- 4. Лестница: четыре части в ряд и ступени от диагностики к подписке ---------- */
#complex[data-v="4"] .complex__grid { grid-template-columns: 1fr; text-align: center; }
#complex[data-v="4"] .complex__visual { display: none; }
#complex[data-v="4"] .h2, #complex[data-v="4"] .lead { margin-inline: auto; }
#complex[data-v="4"] .parts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 38px; margin-top: 50px; text-align: left; }
#complex[data-v="4"] .part { position: relative; flex-direction: column; }
#complex[data-v="4"] .part + .part::before { content: "+"; position: absolute; left: -28px; top: 50%; translate: 0 -50%; font: 700 32px/1 var(--cond); color: var(--coral); }
#complex[data-v="4"] .strips { max-width: var(--wrap); margin: 76px auto 0; padding: 0 32px; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; align-items: end; }
#complex[data-v="4"] .strips__line, #complex[data-v="4"] .strip__dot { display: none; }
#complex[data-v="4"] .strip {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 30px 22px 26px; min-height: calc(214px + var(--step) * 58px);
  clip-path: polygon(0 9px, 14% 0, 33% 7px, 56% 1px, 78% 8px, 100% 2px, 100% 100%, 0 100%);
}
#complex[data-v="4"] .strip:nth-child(2) { --step: 0; } #complex[data-v="4"] .strip:nth-child(3) { --step: 1; } #complex[data-v="4"] .strip:nth-child(4) { --step: 2; }
#complex[data-v="4"] .strip:nth-child(5) { --step: 3; } #complex[data-v="4"] .strip:nth-child(6) { --step: 4; }
#complex[data-v="4"] .strip__t { font-size: 27px; }
#complex[data-v="4"] .strip p { font-size: 14.5px; }
#complex[data-v="4"] .strip .rhythm { font-size: 20px !important; }
#complex[data-v="4"] .strip__price { margin-top: auto; padding-top: 12px; font-size: 38px; }
@media (max-width: 1000px) {
  #complex[data-v="4"] .parts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  #complex[data-v="4"] .part + .part::before { display: none; }
  #complex[data-v="4"] .strips { grid-template-columns: 1fr; justify-items: start; gap: 10px; margin-top: 52px; }
  #complex[data-v="4"] .strip { min-height: 0; width: calc(72% + var(--step) * 7%); padding: 24px 22px; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 16%, calc(100% - 7px) 36%, 100% 58%, calc(100% - 8px) 80%, 100% 100%, 0 100%); }
}
@media (max-width: 760px) {
  #complex[data-v="4"] .complex__grid { text-align: left; }
  #complex[data-v="4"] .h2, #complex[data-v="4"] .lead { margin-inline: 0; }
  #complex[data-v="4"] .parts { grid-template-columns: 1fr; margin-top: 30px; }
  #complex[data-v="4"] .part { flex-direction: row; }
  #complex[data-v="4"] .strips { padding: 0 18px 0 0; }
  #complex[data-v="4"] .strip { padding: 22px 26px 22px 18px; }
}

/* ---------- 5. Зигзаг: шаги по обе стороны от линии времени ---------- */
#complex[data-v="5"] .strips { max-width: 1120px; margin: 76px auto 0; padding: 0 32px; gap: 26px; }
#complex[data-v="5"] .strip { grid-template-columns: 1fr; gap: 8px; padding: 26px 30px 28px; clip-path: none; box-shadow: var(--shadow); }
#complex[data-v="5"] .strip--cream { background: var(--paper); }
#complex[data-v="5"] .strip p, #complex[data-v="5"] .strip__price { grid-column: 1; }
#complex[data-v="5"] .strip__price { margin-top: 6px; }
@media (min-width: 761px) {
  #complex[data-v="5"] .complex__visual { order: 2; }
  #complex[data-v="5"] .strips__line { left: 50%; margin-left: -1px; }
  #complex[data-v="5"] .strip { width: calc(50% - 46px); }
  #complex[data-v="5"] .strip:nth-child(odd) { margin-left: auto; }
  #complex[data-v="5"] .strip + .strip { margin-top: -58px; }
  #complex[data-v="5"] .strip::after { content: ""; position: absolute; top: 50%; right: -46px; width: 46px; height: 2px; background: var(--coral); }
  #complex[data-v="5"] .strip:nth-child(odd)::after { right: auto; left: -46px; }
  #complex[data-v="5"] .strip__dot { left: auto; right: -55px; margin: -9px 0 0; }
  #complex[data-v="5"] .strip:nth-child(odd) .strip__dot { right: auto; left: -55px; }
}
@media (min-width: 1101px) { #complex[data-v="5"] .complex__grid { grid-template-columns: 1fr 1.05fr; } }
@media (max-width: 760px) {
  #complex[data-v="5"] .strips { padding: 0 18px; gap: 16px; margin-top: 48px; }
  #complex[data-v="5"] .strips__line, #complex[data-v="5"] .strip__dot { display: none; }
  #complex[data-v="5"] .strip { padding: 24px 22px; }
  #complex[data-v="5"] .strip:nth-child(even) { margin-right: 26px; }
  #complex[data-v="5"] .strip:nth-child(odd) { margin-left: 26px; }
}
</style>

<template data-v="3" data-before=".strips + .wrap" data-cls="wrap">
  <div class="stages">
    <article class="stage stage--one vr">
      <span class="tape tape--card" aria-hidden="true"></span>
      <p class="stage__tag">Первый этап · около месяца</p>
      <h3>Строим основу</h3>
      <ol class="stage__weeks">
