/* ---------- 3. Плакат: заголовок во всю ширину, под ним коллаж и текст ---------- */

    grid-template-rows: auto auto auto auto auto 1fr; padding-top: calc(var(--head-h) + 34px); padding-bottom: 70px;
  }
  #hero[data-v="3"] .hero__text { display: contents; }
  #hero[data-v="3"] .eyebrow { grid-area: eb; text-align: center; }
  #hero[data-v="3"] .hero__title { grid-area: title; text-align: center; margin-bottom: 48px; }

}
@media (max-width: 760px) {

  #hero[data-v="4"] .hero__art { scale: 1; width: min(84%, 380px); margin-top: 48px; }
}

.door {

}
.door small { font: 600 12px/1.25 var(--cond); letter-spacing: .14em; text-transform: uppercase; }
.door b { font: 700 46px/1 var(--cond); text-transform: uppercase; letter-spacing: -.01em; }

.door--base small { color: var(--cyan); }
.door:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }

@media (min-width: 761px) {
