<!-- Вопросы: варианты 2–5. Колесо остаётся во всех вариантах, меняется панель и место ответа -->
<style>
/* ---------- 2. Тёмная панель: колесо слева, ответ на бумаге справа ---------- */
#faq[data-v="2"] .faq__panel { border-radius: 60px; background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px); background-size: 6px 6px; }
#faq[data-v="2"] .faq__panel::after { background: var(--cyan); }
#faq[data-v="2"] .eyebrow, #faq[data-v="2"] .faq__hint { color: var(--cyan); }
#faq[data-v="2"] .h2 { color: var(--cream); }
#faq[data-v="2"] .faq__answer { background: var(--paper); color: var(--navy); clip-path: polygon(0 0, 100% 12%, 100% 100%, 0 100%); }
#faq[data-v="2"] .faq__label { color: var(--coral-ink); }
#faq[data-v="2"] .faq__q { color: var(--navy); }
#faq[data-v="2"] .wheel-nav__count { color: var(--cream); }
@media (min-width: 1101px) {
  #faq[data-v="2"] .faq__panel { grid-template-columns: 1.1fr 1fr; }
  #faq[data-v="2"] .faq__left { order: 2; }
  #faq[data-v="2"] .faq__panel::after { right: auto; left: -6%; }
  #faq[data-v="2"] .wheel { --point: 90; }
}
@media (max-width: 760px) { #faq[data-v="2"] .faq__panel, #faq[data-v="5"] .faq__panel { margin: 0 8px; border-radius: 30px; } }

/* ---------- 3. Колесо в центре: вопрос выбирается вверху, ответ выходит снизу ---------- */
#faq[data-v="3"] .faq__left, #faq[data-v="4"] .faq__left { display: contents; }
#faq[data-v="3"] .faq__panel { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 0; text-align: center; }
#faq[data-v="3"] .faq__panel::after { display: none; }
#faq[data-v="3"] .eyebrow, #faq[data-v="3"] .h2, #faq[data-v="3"] .faq__hint, #faq[data-v="3"] .faq__answer,
#faq[data-v="4"] .eyebrow, #faq[data-v="4"] .h2, #faq[data-v="4"] .faq__hint, #faq[data-v="4"] .faq__answer, #faq[data-v="4"] .qs { position: relative; z-index: 2; }
#faq[data-v="3"] .eyebrow { order: 1; }
#faq[data-v="3"] .h2 { order: 2; }
#faq[data-v="3"] .faq__hint { order: 3; }
#faq[data-v="3"] .wheel-box { order: 4; width: 100%; margin-top: 70px; }
#faq[data-v="3"] .wheel-wrap { width: min(100%, 540px); }
#faq[data-v="3"] .wheel-wrap::before, #faq[data-v="5"] .wheel-wrap::before {
  content: ""; position: absolute; inset: -8%; z-index: -1; border-radius: 50%;
  background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.4px); background-size: 6px 6px;
}
#faq[data-v="3"] .wheel { --point: 180; }
#faq[data-v="3"] .faq__answer {
  order: 5; width: min(100%, 880px); min-height: 0; margin-top: 34px; padding: 76px 52px 46px;
  clip-path: polygon(0 30px, calc(50% - 28px) 30px, 50% 0, calc(50% + 28px) 30px, 100% 30px, 100% 100%, 0 100%);
}
@media (max-width: 760px) {
  #faq[data-v="3"] .wheel-box { margin-top: 44px; }
  #faq[data-v="3"] .wheel-wrap::before { inset: -3.5%; }
  #faq[data-v="3"] .faq__answer { margin-top: 18px; padding: 64px 22px 30px; }
}

/* ---------- 4. Колесо и список: шесть вопросов кнопками, ответ полосой внизу ---------- */
#faq[data-v="4"] .faq__panel { grid-template-areas: "eb" "h2" "hint" "qs" "ans" "wheel"; gap: 0; align-items: start; }
#faq[data-v="4"] .faq__panel::after { top: -20%; right: -8%; bottom: auto; width: 46%; background: var(--cyan); }
#faq[data-v="4"] .eyebrow { grid-area: eb; }
#faq[data-v="4"] .h2 { grid-area: h2; }
#faq[data-v="4"] .faq__hint { grid-area: hint; }
#faq[data-v="4"] .qs { grid-area: qs; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 26px; }
#faq[data-v="4"] .wheel-box { grid-area: wheel; margin-top: 30px; }
#faq[data-v="4"] .faq__answer { grid-area: ans; min-height: 0; margin-top: 26px; padding: 34px 26px; clip-path: none; background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px); background-size: 6px 6px; }
#faq[data-v="4"] .faq__label { color: var(--cyan); }
.qs__b {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 16px; border: 0; cursor: pointer;
  background: var(--paper); box-shadow: var(--shadow); color: var(--navy); font: 700 17px/1.1 var(--cond); text-transform: uppercase; text-align: left;
  transition: background .25s, transform .3s var(--ease);
}
.qs__b small { font: 600 13px/1 var(--cond); letter-spacing: .14em; color: var(--coral-ink); }
.qs__b::after { content: "→"; font: 400 20px/1 var(--sans); opacity: 0; transform: translateX(-8px); transition: opacity .25s, transform .3s var(--ease); }
.qs__b.is-on { background: var(--cyan); }
.qs__b.is-on small { color: var(--navy); }
.qs__b.is-on::after { opacity: 1; transform: none; }
@media (hover: hover) { .qs__b:hover { background: #d9f1fb; } .qs__b.is-on:hover { background: var(--cyan); } }
@media (min-width: 1101px) {
  #faq[data-v="4"] .faq__panel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "eb wheel" "h2 wheel" "hint wheel" "qs wheel" "ans ans"; grid-template-rows: auto auto auto 1fr auto; gap: 0 64px; }
  #faq[data-v="4"] .qs { grid-template-columns: 1fr; }
  #faq[data-v="4"] .qs__b { font-size: 20px; padding: 13px 20px; }
  #faq[data-v="4"] .qs__b.is-on { transform: translateX(14px); }
  #faq[data-v="4"] .wheel-box { align-self: center; margin: 0; }
  #faq[data-v="4"] .wheel-wrap { width: min(100%, 540px); }
  #faq[data-v="4"] .faq__answer { display: grid; grid-template-columns: 130px minmax(0, 1fr); align-items: start; gap: 24px; margin-top: 48px; padding: 40px 48px; }
  #faq[data-v="4"] .faq__label { margin: 9px 0 0; }
}
@media (max-width: 760px) {
  #faq[data-v="4"] .qs__b { grid-template-columns: minmax(0, 1fr); padding: 10px 12px; font-size: 15px; }
  #faq[data-v="4"] .qs__b small, #faq[data-v="4"] .qs__b::after { display: none; }
}

/* ---------- 5. Голубая панель: колесо уходит за край, ответ записка на скотче ---------- */
#faq[data-v="5"] .faq__panel { border-radius: 60px; background: var(--cyan); }
#faq[data-v="5"] .faq__panel::after { display: none; }
#faq[data-v="5"] .eyebrow, #faq[data-v="5"] .faq__hint { color: var(--navy); }
#faq[data-v="5"] .faq__answer { position: relative; overflow: visible; border-radius: 0; clip-path: none; background: var(--paper); color: var(--navy); box-shadow: 0 30px 44px -24px rgba(6,27,79,.65); rotate: -1.2deg; }
#faq[data-v="5"] .faq__answer::before { content: ""; position: absolute; left: 50%; top: -15px; width: 130px; height: 32px; margin-left: -65px; background: rgba(233,222,196,.92); box-shadow: 0 1px 2px rgba(0,0,0,.12); rotate: -3deg; }
#faq[data-v="5"] .faq__label { color: var(--coral-ink); }
#faq[data-v="5"] .faq__q { color: var(--navy); }
#faq[data-v="5"] .seg.is-active path { fill: var(--coral-btn); }
#faq[data-v="5"] .seg.is-active text { fill: #fff; }
#faq[data-v="5"] .wheel-wrap::before { inset: -4%; }
@media (min-width: 1101px) {
  #faq[data-v="5"] .faq__panel { grid-template-columns: minmax(0, 1fr) minmax(0, .82fr); gap: 56px; padding-right: 0; }
  #faq[data-v="5"] .faq__answer { padding: 56px 40px 40px; }
  #faq[data-v="5"] .wheel-box { justify-items: start; }
  #faq[data-v="5"] .wheel-wrap { width: 720px; margin: -30px 0; }
  #faq[data-v="5"] .wheel-nav { display: flex; position: absolute; left: -6px; bottom: -34px; z-index: 3; }
}
@media (max-width: 760px) { #faq[data-v="5"] .faq__answer { rotate: none; } #faq[data-v="5"] .wheel-wrap::before { inset: -3%; } }
</style>

<template data-v="4" data-into=".faq__left" data-cls="qs">
  <button type="button" class="qs__b" data-seg="0"><small>01</small>Сколько стоит?</button>
  <button type="button" class="qs__b" data-seg="1"><small>02</small>Гарантируете пациентов?</button>
  <button type="button" class="qs__b" data-seg="2"><small>03</small>Когда запустите рекламу?</button>
  <button type="button" class="qs__b" data-seg="3"><small>04</small>Можно одну услугу?</button>
  <button type="button" class="qs__b" data-seg="4"><small>05</small>Ведёте таргет?</button>
  <button type="button" class="qs__b" data-seg="5"><small>06</small>Кому принадлежит сайт?</button>
</template>
