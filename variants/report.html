<!-- Отчёт: варианты 2–5 -->
<style>
/* ---------- 2. Тёмная панель: синий фон, картинка на бумажной карточке слева ---------- */
#report[data-v="2"] .report__grid {
  max-width: 1400px; padding: 88px 64px 104px; border-radius: 60px; color: var(--cream);
  background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px); background-size: 6px 6px;
}
#report[data-v="2"] .eyebrow { color: var(--cyan); }
#report[data-v="2"] .h2 { color: var(--cream); }
#report[data-v="2"] .ticks li::before { border-color: var(--cyan); }
#report[data-v="2"] .principle { background: var(--cream); color: var(--navy); }
#report[data-v="2"] .report__img { mix-blend-mode: normal; -webkit-mask-image: none; mask-image: none; background: var(--cream); box-shadow: 0 0 0 12px var(--cream), 0 34px 54px -22px rgba(0,0,0,.65); rotate: -1.5deg; width: 92%; }
@media (min-width: 1101px) { #report[data-v="2"] .report__visual { order: -1; } #report[data-v="2"] .chart { right: 10px; } }
@media (max-width: 760px) {
  #report[data-v="2"] .report__grid { margin: 0 8px; padding: 52px 18px 60px; border-radius: 30px; }
  #report[data-v="2"] .report__img { width: 100%; box-shadow: 0 0 0 8px var(--cream), 0 26px 40px -20px rgba(0,0,0,.65); }
}

/* ---------- 3. Образец отчёта: вместо картинки лист с цифрами месяца ---------- */
#report[data-v="3"] .report__visual { display: none; }
.dash { position: relative; }
.dash__sheet { --rz: 1.2deg; position: relative; background: var(--paper); box-shadow: 0 34px 54px -26px rgba(6,27,79,.55), 0 1px 0 rgba(0,0,0,.04); padding: 44px 36px 36px; transform: rotate(var(--rz)); transition: transform .25s ease-out; }
.dash__sheet::after { content: "образец"; position: absolute; right: 26px; bottom: 26px; padding: 8px 14px 7px; border: 3px solid var(--coral); color: var(--coral); font: 700 20px/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; rotate: -8deg; }
.dash__head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; padding-bottom: 16px; border-bottom: 2px solid var(--navy); }
.dash__head b { font: 700 28px/1 var(--cond); text-transform: uppercase; color: var(--navy); }
.dash__head small { font-size: 13.5px; color: var(--coral-ink); }
.dash__kpi { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dash__kpi li { padding: 20px 14px 20px 0; }
.dash__kpi li + li { padding-left: 18px; border-left: 2px dotted rgba(228,95,69,.6); }
.dash__kpi small { display: block; font: 600 12px/1.2 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dash__kpi b { display: block; margin: 8px 0 4px; font: 700 54px/1 var(--cond); color: var(--cyan-deep); }
.dash__kpi span { display: block; font-size: 13px; line-height: 1.3; color: var(--muted); }
.dash__sub { margin: 4px 0 12px; padding-top: 18px; border-top: 2px dotted rgba(228,95,69,.6); font: 600 13px/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--navy); }
.dash .bar { grid-template-columns: 84px 1fr; margin-bottom: 9px; font-size: 14px; }
.dash .bar i { height: 16px; transform: scaleX(0); }
.dash__sheet.is-in .bar i { transform: scaleX(1); }
.dash__sheet.is-in .bar:nth-child(2) i { transition-delay: .15s; } .dash__sheet.is-in .bar:nth-child(3) i { transition-delay: .3s; } .dash__sheet.is-in .bar:nth-child(4) i { transition-delay: .45s; }
.dash__log { list-style: none; margin: 0; padding: 0 120px 0 0; display: grid; gap: 8px; font-size: 14.5px; color: var(--navy); }
.dash__log li { position: relative; padding-left: 26px; }
.dash__log li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 11px; height: 6px; border-left: 2.5px solid var(--coral); border-bottom: 2.5px solid var(--coral); transform: rotate(-45deg); }
@media (max-width: 1100px) { .dash { width: min(100%, 620px); margin-inline: auto; } }
@media (max-width: 760px) {
  .dash__sheet { --rz: 0deg; padding: 36px 20px 26px; }
  .dash__kpi b { font-size: 42px; }
  .dash__kpi li + li { padding-left: 12px; }
  .dash__log { padding-right: 0; padding-bottom: 54px; }
  .dash__sheet::after { right: 18px; bottom: 18px; font-size: 17px; }
}

/* ---------- 4. Четыре карточки: что вы получаете каждый месяц, и принцип полосой ---------- */
#report[data-v="4"] .report__text, #report[data-v="5"] .report__text { display: contents; }
#report[data-v="4"] .eyebrow { grid-area: eb; margin: 0; align-self: end; }
#report[data-v="4"] .h2 { grid-area: h2; align-self: start; }
#report[data-v="4"] .report__visual { grid-area: visual; }
#report[data-v="4"] .ticks { grid-area: ticks; counter-reset: t; margin: 0; gap: 18px; }
#report[data-v="4"] .ticks li { counter-increment: t; padding: 76px 22px 26px; background: var(--paper); box-shadow: var(--shadow); font-size: 16.5px; }
#report[data-v="4"] .ticks li::before { content: "0" counter(t); left: 22px; top: 24px; width: auto; height: auto; border: 0; transform: none; font: 700 36px/1 var(--cond); color: var(--cyan-deep); }
#report[data-v="4"] .principle { grid-area: quote; margin: 0; padding: 38px 64px; text-align: center; font-size: clamp(24px, 2.5vw, 34px); }
@media (min-width: 1101px) {
  #report[data-v="4"] .report__grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); grid-template-areas: "eb visual" "h2 visual" "ticks ticks" "quote quote"; gap: 22px 64px; }
  #report[data-v="4"] .report__visual { width: min(100%, 400px); justify-self: end; margin-bottom: 40px; }
  #report[data-v="4"] .chart { width: 250px; right: auto; left: -150px; bottom: -34px; padding: 16px 18px; }
  #report[data-v="4"] .ticks { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 26px; }
  #report[data-v="4"] .ticks li:nth-child(odd) { rotate: -.7deg; }
  #report[data-v="4"] .ticks li:nth-child(even) { rotate: .6deg; }
  #report[data-v="4"] .principle { margin-top: 26px; }
}
@media (max-width: 1100px) {
  #report[data-v="4"] .report__grid { grid-template-areas: "eb" "h2" "visual" "ticks" "quote"; gap: 22px; }
  #report[data-v="4"] .ticks { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 20px; }
  #report[data-v="4"] .principle { padding: 30px 28px; margin-top: 14px; }
}
@media (max-width: 760px) {
  #report[data-v="4"] .ticks { grid-template-columns: 1fr; gap: 12px; }
  #report[data-v="4"] .ticks li { padding: 20px 18px 20px 74px; }
  #report[data-v="4"] .ticks li::before { left: 18px; top: 20px; font-size: 30px; }
  #report[data-v="4"] .principle { text-align: left; padding: 26px 22px; }
}

/* ---------- 5. Принцип вперёд: крупная цитата открывает блок ---------- */
#report[data-v="5"] .principle {
  grid-area: quote; margin: 0 0 64px; padding: 4px 0 4px 44px; max-width: 1080px; background: none; color: var(--navy); border-left: 6px solid var(--coral);
  font: 400 clamp(30px, 4.3vw, 60px)/1.08 var(--serif); letter-spacing: -.01em;
}
#report[data-v="5"] .principle::before { position: static; display: table; margin: 0 0 22px; transform: rotate(-3deg); }
#report[data-v="5"] .eyebrow { grid-area: eb; }
#report[data-v="5"] .h2 { grid-area: h2; font-size: clamp(30px, 3.2vw, 44px); }
#report[data-v="5"] .ticks { grid-area: ticks; margin-top: 30px; align-self: start; }
#report[data-v="5"] .report__visual { grid-area: visual; }
@media (min-width: 1101px) {
  #report[data-v="5"] .report__grid { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); grid-template-areas: "quote quote" "visual eb" "visual h2" "visual ticks"; grid-template-rows: auto auto auto 1fr; gap: 0 76px; align-items: start; }
  #report[data-v="5"] .eyebrow { padding-top: 30px; }
  #report[data-v="5"] .chart { right: auto; left: -10px; }
}
@media (max-width: 1100px) {
  #report[data-v="5"] .report__grid { grid-template-areas: "quote" "eb" "h2" "ticks" "visual"; gap: 0; }
  #report[data-v="5"] .principle { margin-bottom: 44px; }
  #report[data-v="5"] .report__visual { margin-top: 44px; }
}
@media (max-width: 760px) { #report[data-v="5"] .principle { padding-left: 22px; border-left-width: 5px; font-size: clamp(27px, 7.6vw, 34px); } }
</style>

<template data-v="3" data-into=".report__grid" data-cls="dash">
  <div class="dash__sheet vr" data-vtilt role="img" aria-label="Образец ежемесячного отчёта, данные условные">
    <span class="tape tape--card" aria-hidden="true"></span>
    <div class="dash__head"><b>Отчёт за месяц</b><small>пример, данные условные</small></div>
    <ul class="dash__kpi">
      <li><small>Обращения</small><b>64</b><span>звонки и заявки за месяц</span></li>
      <li><small>С Яндекс Карт</small><b>27</b><span>звонки и маршруты</span></li>
      <li><small>Задачи</small><b>18</b><span>сделано из 18 по плану</span></li>
    </ul>
    <p class="dash__sub">Обращения по каналам</p>
    <div class="dash__bars">
      <div class="bar" style="--v:.78"><span>Карты</span><i></i></div>
      <div class="bar" style="--v:.6"><span>Директ</span><i></i></div>
      <div class="bar" style="--v:.46"><span>Поиск</span><i></i></div>
      <div class="bar" style="--v:.24"><span>Площадки</span><i></i></div>
    </div>
    <p class="dash__sub">Что сделано</p>
    <ul class="dash__log">
      <li>Новая страница услуги и две статьи на сайте</li>
      <li>Фото, цены и ответы на отзывы в карточке</li>
      <li>План на следующий месяц согласован</li>
    </ul>
  </div>
</template>
