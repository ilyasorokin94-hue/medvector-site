<!-- Яндекс Директ: варианты 2–5 -->
<style>
/* ---------- 2. Светлая панель: бумага вместо синего, лист с планом запуска тёмный ---------- */
#direct[data-v="2"] .direct__panel { background-color: var(--cream-2); color: var(--navy); background-image: radial-gradient(rgba(6,27,79,.09) 1px, transparent 1.3px); background-size: 9px 9px; }
#direct[data-v="2"] .eyebrow--light { color: var(--cyan-ink); }
#direct[data-v="2"] .h2--light { color: var(--navy); }
#direct[data-v="2"] .direct__lead, #direct[data-v="2"] .direct__foot p { color: rgba(6,27,79,.82); }
#direct[data-v="2"] .offer { background: var(--navy); color: #fff; }
#direct[data-v="2"] .offer + .offer { background: var(--cyan); color: var(--navy); }
#direct[data-v="2"] .direct__sheet { background-color: var(--navy); color: var(--cream); background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px); background-size: 6px 6px; }
#direct[data-v="2"] .direct__big { color: rgba(6,27,79,.07); }
#direct[data-v="2"] .checklist__row { color: var(--cream); }
#direct[data-v="2"] .checklist__row b { color: var(--cyan); }
#direct[data-v="2"] .launch__title span { color: #fff; }
#direct[data-v="2"] .launch__title strong { color: var(--cyan); }
#direct[data-v="2"] .day, #direct[data-v="3"] .day { background: var(--cream); color: var(--navy); box-shadow: none; }
#direct[data-v="2"] .day--b, #direct[data-v="3"] .day--b { background: var(--cyan); }
#direct[data-v="2"] .day--c, #direct[data-v="3"] .day--c { background: none; color: #fff; box-shadow: inset 0 0 0 2px var(--cream); }
#direct[data-v="2"] .day--go, #direct[data-v="3"] .day--go { background: var(--coral-btn); color: #fff; }
#direct[data-v="2"] .days__legend, #direct[data-v="3"] .days__legend { color: rgba(247,242,233,.85); }
#direct[data-v="2"] .k, #direct[data-v="3"] .k { background: var(--cream); }
#direct[data-v="2"] .k--b, #direct[data-v="3"] .k--b { background: var(--cyan); }
#direct[data-v="2"] .k--c, #direct[data-v="3"] .k--c { background: none; box-shadow: inset 0 0 0 2px var(--cream); }
#direct[data-v="2"] .k--go, #direct[data-v="3"] .k--go { background: var(--coral-btn); }
#direct[data-v="2"] .launch__note, #direct[data-v="3"] .launch__note { color: rgba(247,242,233,.78); }
@media (min-width: 1101px) {
  #direct[data-v="2"] .direct__panel { grid-template-columns: .85fr 1.15fr; }
  #direct[data-v="2"] .direct__photo { order: -1; --rz: -2deg; }
}

/* ---------- 3. Большая семёрка: срок запуска главный на экране ---------- */
#direct[data-v="3"] .direct__sheet { display: contents; }
#direct[data-v="3"] .direct__photo { display: none; }
#direct[data-v="3"] .launch { position: relative; z-index: 1; border: 0; padding: 0; color: var(--cream); }
#direct[data-v="3"] .launch__title { display: grid; gap: 4px; }
#direct[data-v="3"] .launch__title span { color: #fff; font-size: 30px; }
#direct[data-v="3"] .launch__title strong { font-size: clamp(210px, 25vw, 380px); line-height: .8; color: var(--cyan); margin: 6px 0 14px -.03em; }
/* блок с семёркой стоит первым: листки дней раскрываются вместе с панелью, не дожидаясь прокрутки */
.js #direct[data-v="3"] .direct__panel.is-in .day { transform: none; opacity: 1; transition-delay: calc(var(--i) * 120ms + 700ms); }
#direct[data-v="3"] .direct__head, #direct[data-v="3"] .checklist { position: relative; z-index: 1; background: var(--cream); color: var(--navy); }
#direct[data-v="3"] .direct__head { padding: 48px 48px 26px; clip-path: polygon(0 2%, 100% 0, 100% 100%, 0 100%); }
#direct[data-v="3"] .checklist { padding: 4px 48px 40px; clip-path: polygon(0 0, 100% 0, 99.4% 97%, .6% 100%); margin-top: -1px; }
#direct[data-v="3"] .eyebrow--light { color: var(--cyan-ink); }
#direct[data-v="3"] .h2--light { color: var(--navy); font-size: clamp(30px, 3vw, 44px); }
#direct[data-v="3"] .direct__lead { color: rgba(6,27,79,.82); }
#direct[data-v="3"] .offer { background: var(--navy); color: #fff; }
#direct[data-v="3"] .offer + .offer { background: var(--cyan); color: var(--navy); }
#direct[data-v="3"] .checklist__row { font-size: 23px; padding: 13px 0; }
@media (min-width: 1101px) {
  #direct[data-v="3"] .direct__panel { grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr); grid-template-areas: "launch head" "launch check" "foot foot"; gap: 0 60px; }
  #direct[data-v="3"] .launch { grid-area: launch; align-self: center; }
  #direct[data-v="3"] .direct__head { grid-area: head; }
  #direct[data-v="3"] .checklist { grid-area: check; align-self: start; }
  #direct[data-v="3"] .direct__foot { grid-area: foot; margin-top: 56px; }
}
@media (max-width: 1100px) {
  #direct[data-v="3"] .direct__panel { gap: 0; }
  #direct[data-v="3"] .launch { order: -1; margin-bottom: 44px; }
  #direct[data-v="3"] .direct__foot { margin-top: 40px; }
}
@media (max-width: 760px) {
  #direct[data-v="3"] .launch { padding: 0 8px; margin-bottom: 34px; }
  #direct[data-v="3"] .launch__title span { font-size: 24px; }
  #direct[data-v="3"] .launch__title strong { font-size: 200px; }
  #direct[data-v="3"] .direct__head { padding: 34px 20px 18px; }
  #direct[data-v="3"] .checklist { padding: 0 20px 28px; }
  #direct[data-v="3"] .checklist__row { font-size: 20px; }
}

/* ---------- 4. Линейка запуска: семь дней во всю ширину, под ними этапы ---------- */
#direct[data-v="4"] .direct__sheet { grid-template-columns: 1fr; gap: 40px; }
#direct[data-v="4"] .launch { order: -1; border: 0; padding: 0; }
#direct[data-v="4"] .checklist { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; border-top: 2px dashed rgba(228,95,69,.6); padding-top: 34px; }
#direct[data-v="4"] .checklist__row { flex-direction: column-reverse; align-items: flex-start; gap: 8px; padding: 0; font-size: 22px; }
#direct[data-v="4"] .checklist__row i { display: none; }
#direct[data-v="4"] .checklist__row b { font-size: 15px; letter-spacing: .14em; }
@media (min-width: 761px) {
  #direct[data-v="4"] .launch { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 52px; }
  #direct[data-v="4"] .launch__title { grid-row: 1 / span 3; align-self: center; display: grid; gap: 4px; }
  #direct[data-v="4"] .launch__title strong { font-size: 150px; margin: 4px 0 10px; }
  #direct[data-v="4"] .days { margin: 0; gap: 10px; align-self: end; }
  #direct[data-v="4"] .day { aspect-ratio: 1.45; }
  #direct[data-v="4"] .day b { font-size: 34px; }
  #direct[data-v="4"] .days__legend { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  #direct[data-v="4"] .days__legend li { border-top: 4px solid var(--navy); padding-top: 10px; font: 600 15px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--navy); }
  #direct[data-v="4"] .days__legend li:nth-child(1) { grid-column: span 3; }
  #direct[data-v="4"] .days__legend li:nth-child(2) { grid-column: span 2; border-color: var(--cyan); }
  #direct[data-v="4"] .days__legend li:nth-child(3) { border-top-style: dashed; }
  #direct[data-v="4"] .days__legend li:nth-child(4) { border-color: var(--coral-btn); color: var(--coral-ink); }
  #direct[data-v="4"] .days__legend .k { display: none; }
  #direct[data-v="4"] .launch__note { grid-column: 2; }
}
@media (max-width: 1100px) { #direct[data-v="4"] .checklist { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; } }
@media (max-width: 760px) { #direct[data-v="4"] .checklist__row { font-size: 19px; } #direct[data-v="4"] .direct__sheet { gap: 30px; } }

/* ---------- 5. Два оффера: карточки лендингов и четыре цифры ---------- */
.dx {
  position: relative; max-width: 1400px; margin: 0 auto; overflow: hidden; border-radius: 80px 80px 0 0; padding: 100px 64px 170px; color: var(--cream);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 60px 56px; align-items: center;
  background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.4px); background-size: 6px 6px;
}
.dx::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 48px; background: var(--cream); z-index: 2; pointer-events: none;
  clip-path: polygon(0 100%, 0 55%, 4% 72%, 9% 48%, 15% 68%, 21% 50%, 27% 70%, 33% 46%, 40% 66%, 46% 50%, 52% 72%, 58% 48%, 64% 68%, 71% 50%, 77% 70%, 83% 46%, 89% 64%, 95% 48%, 100% 62%, 100% 100%);
}
.dx > * { position: relative; z-index: 1; }
.dx > .direct__big { position: absolute; z-index: 0; }
.dx__head .h2 { font-size: clamp(32px, 3.6vw, 52px); }
.dx__offers { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.dx__card { --rz: -2deg; position: relative; background: var(--paper); color: var(--navy); padding: 40px 26px 30px; box-shadow: 0 30px 50px -24px rgba(0,0,0,.6); transform: rotate(var(--rz)); transition: transform .25s ease-out; }
.dx__card--b { --rz: 2.4deg; margin-top: 52px; }
.dx__tag { font: 600 13px/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--coral-ink); }
.dx__card h3 { margin: 10px 0 20px; font: 700 clamp(30px, 3vw, 44px)/1 var(--cond); text-transform: uppercase; color: var(--navy); padding-bottom: 18px; border-bottom: 2px dashed rgba(228,95,69,.6); }
.dx__tiles { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px dashed rgba(8,174,234,.55); border-bottom: 2px dashed rgba(8,174,234,.55); }
.dx__tiles li { padding: 30px 26px 32px; }
.dx__tiles li + li { border-left: 2px dashed rgba(8,174,234,.55); }
.dx__tiles b { display: block; font: 700 88px/.9 var(--cond); color: var(--cyan); letter-spacing: -.02em; white-space: nowrap; }
.dx__tiles span { display: block; margin-top: 14px; font-size: 15.5px; line-height: 1.4; color: rgba(247,242,233,.88); }
@media (max-width: 1100px) {
  .dx { grid-template-columns: 1fr; gap: 48px; }
  .dx__tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dx__tiles li:nth-child(3) { border-left: 0; }
  .dx__tiles li:nth-child(n+3) { border-top: 2px dashed rgba(8,174,234,.55); }
}
@media (max-width: 760px) {
  .dx { padding: 56px 20px 120px; border-radius: 40px 40px 0 0; gap: 36px; }
  .dx::after { height: 34px; }
  .dx__offers { grid-template-columns: 1fr; gap: 26px; padding: 0 6px; }
  .dx__card { --rz: -1.2deg; padding: 34px 22px 26px; }
  .dx__card--b { --rz: 1.4deg; margin-top: 0; }
  .dx__tiles li { padding: 22px 14px 24px; }
  .dx__tiles b { font-size: 62px; }
  .dx__tiles span { font-size: 14px; }
}
</style>
