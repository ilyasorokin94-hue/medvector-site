<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Превью ссылки 1200×630</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  /* Макет картинки для превью ссылки: снимается скриптом og.js в assets/img/og-cover.jpg */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--cream); }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 400px; }
  .og__text { padding: 54px 0 0 64px; }
  .og__logo { width: 250px; display: block; }
  .og__eyebrow { margin-top: 62px; font: 600 19px/1 var(--cond); letter-spacing: .26em; text-transform: uppercase; color: var(--cyan-ink); }
  .og__title { margin: 18px 0 0; font: 700 59px/1.04 var(--cond); color: var(--navy); letter-spacing: -.01em; white-space: nowrap; }
  .og__serif { margin: 18px 0 0; font: 400 48px/1.1 var(--serif); color: var(--navy); }
  .og__serif em { font-style: normal; color: var(--cyan); }
  .og__tape { position: absolute; left: 64px; bottom: 54px; background: var(--cyan); color: var(--navy); font: 600 23px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; padding: 15px 24px; transform: rotate(-1deg);
    clip-path: polygon(0 6%, 100% 0, 99% 94%, 1% 100%); }
  .og__art { position: relative; }
  .og__art img { position: absolute; right: 26px; top: 18px; height: 594px; width: auto; }
</style>
</head>
<body>
<div class="og">
  <div class="og__text">
    <img class="og__logo" src="../assets/img/medvector-logo-transparent.png" alt="">
    <p class="og__eyebrow">Агентство маркетинга для стоматологий</p>
    <p class="og__title">Маркетинг для стоматологий<br>по честной цене.</p>
    <p class="og__serif">Только то, что нужно клинике<em>.</em></p>
    <p class="og__tape">Яндекс Директ · Сайт · Яндекс Карты · SEO</p>
  </div>
  <div class="og__art"><img src="../assets/img/gen-hero-fork.jpg" alt=""></div>
</div>
</body>
</html>
